<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Kevin Dai — Chemical engineering, AI engineering, AI for science</title>
  <desc id="desc">A dark emerald research terminal with a slowly rotating molecular orbit and moving signals. University of Toronto.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081510"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#39d353" stop-opacity=".16"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8bdaa1" stroke-opacity=".055"/></pattern>
    <clipPath id="round"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .orbit{transform-origin:960px 202px;animation:rotate 32s linear infinite}
    .signal{stroke-dasharray:12 220;animation:signal 8s linear infinite}
    .cursor{animation:blink 1.8s steps(2,end) infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @keyframes signal{to{stroke-dashoffset:-464}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{50%{opacity:.4}}
    @media(prefers-reduced-motion:reduce){.orbit,.signal,.cursor,.pulse{animation:none}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <ellipse cx="965" cy="200" rx="285" ry="245" fill="url(#glow)"/>
    <path d="M0 55H1200M0 345H1200" stroke="#22382d"/>
    <g fill="#698373"><circle cx="30" cy="28" r="4"/><circle cx="47" cy="28" r="4"/><circle cx="64" cy="28" r="4"/></g>
    <text x="91" y="33" fill="#91ab9a" font-family="monospace" font-size="13">kevin / ideas in progress</text>
    <circle cx="1075" cy="28" r="4" fill="#56e77d" class="pulse"/>
    <text x="1090" y="33" fill="#a6bcae" font-family="monospace" font-size="12">BUILDING</text>
    <text x="55" y="109" fill="#69e68c" font-family="monospace" font-size="14" letter-spacing="3">SCIENCE MEETS SOFTWARE</text>
    <text x="51" y="193" fill="#f0f6f2" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" letter-spacing="-3">Kevin Dai<tspan fill="#56e77d">.</tspan></text>
    <text x="55" y="238" fill="#b5c9bd" font-family="Arial, Helvetica, sans-serif" font-size="23">Chemical engineering. AI engineering. AI for science.</text>
    <text x="55" y="298" fill="#69e68c" font-family="monospace" font-size="17">&gt; turning curiosity into things that work</text>
    <rect x="481" y="284" width="9" height="18" rx="1" fill="#69e68c" class="cursor"/>
    <g fill="none" stroke="#315c3f" stroke-width="1.3">
      <circle cx="960" cy="202" r="115" stroke-dasharray="2 9"/>
      <ellipse cx="960" cy="202" rx="137" ry="53" transform="rotate(-30 960 202)"/>
      <ellipse cx="960" cy="202" rx="137" ry="53" transform="rotate(30 960 202)"/>
      <ellipse cx="960" cy="202" rx="137" ry="53" transform="rotate(90 960 202)"/>
    </g>
    <g class="orbit" fill="#7cf59b">
      <circle cx="960" cy="65" r="5"/>
      <circle cx="1079" cy="270" r="5"/>
      <circle cx="841" cy="270" r="5"/>
    </g>
    <path d="M845 202H903L923 168L953 233L976 187L994 202H1075" fill="none" stroke="#275d39" stroke-width="2"/>
    <path d="M845 202H903L923 168L953 233L976 187L994 202H1075" fill="none" stroke="#7cf59b" stroke-width="3" class="signal"/>
    <text x="55" y="378" fill="#91ab9a" font-family="monospace" font-size="13">UNIVERSITY OF TORONTO</text>
    <text x="1145" y="378" text-anchor="end" fill="#91ab9a" font-family="monospace" font-size="13">RESEARCH / CODE / REPEAT</text>
    <rect x=".5" y=".5" width="1199" height="399" rx="20" fill="none" stroke="#294533"/>
  </g>
</svg>
